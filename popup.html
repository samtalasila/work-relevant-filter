<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; margin: 0; padding: 14px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; color: #1f2328; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #656d76; margin: 16px 0 6px; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    .hint { color: #656d76; font-weight: 400; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font: inherit; }
    textarea { resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .cols { display: flex; gap: 8px; }
    .cols > div { flex: 1; }
    button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
    button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    #status { color: #656d76; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 160px; overflow-y: auto; }
    li { padding: 5px 0; border-bottom: 1px solid #eaeef2; }
    .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-right: 4px; }
    .allow { background: #dafbe1; color: #116329; }
    .block { background: #ffebe9; color: #a40e26; }
    .meta { color: #656d76; font-size: 12px; }
    .empty { color: #8c959f; }
  </style>
</head>
<body>
  <h1>Work-Relevant Filter</h1>

  <label for="apiKey">Groq API key <span class="hint">(console.groq.com/keys)</span></label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="gsk_…">

  <label for="model">Model</label>
  <input id="model" list="models">
  <datalist id="models"></datalist>

  <label for="persona">Persona</label>
  <select id="persona"></select>

  <label for="workDescription">Your work <span class="hint">(what counts as relevant)</span></label>
  <textarea id="workDescription" rows="4"></textarea>

  <label for="keywords">Backup keywords <span class="hint">(used when Groq is unreachable; r/name for a subreddit)</span></label>
  <textarea id="keywords" rows="4"></textarea>

  <div class="cols">
    <div>
      <label for="allowSubs">Always allow</label>
      <textarea id="allowSubs" rows="3" placeholder="LocalLLaMA"></textarea>
    </div>
    <div>
      <label for="blockSubs">Always block</label>
      <textarea id="blockSubs" rows="3" placeholder="aww"></textarea>
    </div>
  </div>

  <div class="row">
    <button class="primary" id="save">Save</button>
    <button id="test">Test key</button>
    <span id="status"></span>
  </div>

  <h2>Recent verdicts</h2>
  <ul id="verdicts"></ul>

  <h2>Unlocks</h2>
  <ul id="overrides"></ul>

  <div class="row"><button id="clearCache">Clear cached verdicts</button></div>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
